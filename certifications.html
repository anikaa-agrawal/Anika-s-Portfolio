<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Blueprint Certifications | Anika Agrawal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

        :root {
            --bg: #101113;
            --bg-panel: #17181B;
            --ink: #F5F1E8;
            --ink-soft: #A7A79C;
            --border: #26272B;
            --accent: #3E93FF;
            --accent-ink: #08090B;
            --gold: #E8B450;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background-color: var(--bg);
            color: var(--ink);
            line-height: 1.6;
            padding: 40px 24px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            color: var(--ink-soft);
            text-decoration: none;
            margin-bottom: 32px;
            font-size: 14px;
            transition: color 0.2s;
            font-family: 'IBM Plex Mono', monospace;
        }

        .back-link:hover {
            color: var(--accent);
        }

        header {
            margin-bottom: 48px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 24px;
        }

        header h1 {
            font-family: 'Fraunces', serif;
            font-size: 36px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        header p {
            color: var(--ink-soft);
            font-size: 16px;
        }

        /* 2-Column Grid for Certifications */
        .cert-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 32px;
        }

        @media (max-width: 768px) {
            .cert-grid {
                grid-template-columns: 1fr;
            }
        }

        .cert-card {
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color 0.25s ease, transform 0.25s ease;
        }

        .cert-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .cert-image-container {
            width: 100%;
            height: 320px;
            background-color: #0f1012;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cert-image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Shows full certificate image clearly */
        }

        .cert-content h3 {
            font-family: 'Fraunces', serif;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--ink);
        }

        .cert-meta {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--ink-soft);
            margin-bottom: 20px;
        }

        .verify-btn {
            display: block;
            text-align: center;
            background-color: var(--accent);
            color: var(--accent-ink);
            padding: 12px 20px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .verify-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -8px rgba(62,147,255,.55);
        }
    </style>
</head>
